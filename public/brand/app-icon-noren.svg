<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <!-- 背景：ダークネイビー（藍色）の角丸正方形アプリアイコン -->
  <rect width="120" height="120" rx="26" fill="#14243B" />

  <!-- 暖簾の上部バー（のれん棒） -->
  <rect x="22" y="22" width="76" height="4.5" rx="2.2" fill="#F5BA42" />
  <!-- 吊り下げループ -->
  <rect x="28" y="20" width="6" height="8" rx="1.5" fill="#F5BA42" />
  <rect x="57" y="20" width="6" height="8" rx="1.5" fill="#F5BA42" />
  <rect x="86" y="20" width="6" height="8" rx="1.5" fill="#F5BA42" />

  <!-- 店内からあふれる温かい光の空間（めくられた暖簾の奥） -->
  <path d="M48 28 L 74 28 C 74 28, 74 65, 74 86 C 60 86, 44 86, 40 86 C 42 70, 44 48, 48 28 Z" fill="#F5BA42" opacity="0.25" />

  <!-- 右側の暖簾（下がっている布） -->
  <path d="M62 28 L 92 28 L 92 78 C 92 80, 90 82, 88 82 L 64 82 C 62 82, 62 80, 62 78 Z" 
        fill="#1B3150" stroke="#F5BA42" stroke-width="2.5" />

  <!-- 左側の暖簾（手でめくられている布） -->
  <path d="M28 28 L 59 28 L 59 46 C 59 46, 52 52, 42 66 C 36 60, 32 50, 28 42 Z" 
        fill="#1B3150" stroke="#F5BA42" stroke-width="2.5" stroke-linejoin="round" />

  <!-- 人のピクトグラム（温かみのあるイエロー、目鼻口・髪・影なしの極めてミニマルなフラット形状） -->
  <!-- 頭部（完全な真円ピクトグラム） -->
  <circle cx="68" cy="54" r="11.5" fill="#F5BA42" />

  <!-- 上半身・肩・めくる腕 -->
  <!-- 手前または奥から暖簾をクイッと持ち上げ、覗き込んでいるシルエット -->
  <path d="M42 68 C 45 61, 51 63, 56 68 L 64 77 C 69 75, 76 75, 82 78 C 86 80, 88 84, 88 92 L 54 92 C 54 86, 50 82, 46 80 L 40 74 C 38 71, 39 69, 42 68 Z" 
        fill="#F5BA42" />
  
  <!-- めくり上げる手首と手のライン -->
  <path d="M43 68 C 46 62, 53 60, 56 68" 
        fill="none" stroke="#F5BA42" stroke-width="4.5" stroke-linecap="round" />
</svg>
