<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- 背景：ダークネイビーの角丸正方形アイコン（16px縮小耐性設計） -->
  <rect width="100" height="100" rx="22" fill="#14243B" />

  <!-- 暖簾バー（藍色に馴染むトーン） -->
  <rect x="15" y="15" width="70" height="3.5" rx="1.5" fill="#253E5E" />

  <!-- 暖簾（左側：堂々と垂れる藍色の布） -->
  <rect x="18" y="20" width="30" height="64" rx="2" fill="#1D334F" />

  <!-- 暖簾（右側奥）：めくられて露わになった店内の温かい黄色の光と、覗き込む人の丸い頭部 -->
  <!-- 覗き込む人の頭部／居場所の温かい灯り（太いイエローの満月・サークル） -->
  <circle cx="65" cy="52" r="16" fill="#F5BA42" />

  <!-- 暖簾（右側：上半分は静かに垂れ、下半分が大胆にめくれている） -->
  <path d="M52 20 L 82 20 L 82 52 L 68 52 C 60 52, 52 44, 52 36 Z" fill="#1D334F" />

  <!-- めくれた暖簾の折り返しフラップ（大胆なコントラスト面） -->
  <path d="M52 38 L 74 74 L 52 84 Z" fill="#F5BA42" opacity="0.3" />
  <path d="M52 38 C 52 56, 68 76, 76 76 L 82 76 L 82 52 Z" fill="#1D334F" />

  <!-- 手前でめくり上げている手の温もり（太く明快なオーガニックシェイプ） -->
  <path d="M52 84 L 70 84 C 74 84, 76 81, 74 77 L 62 56 C 60 52, 55 52, 53 55 L 52 84 Z" fill="#F5BA42" />
</svg>
